[project]
name = "bandcamp-sync"
version = "0.1.0"
description = "Sync your Bandcamp library to a local folder for DJ software"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SakiiR", email = "9950578+SakiiR@users.noreply.github.com" }]
keywords = ["bandcamp", "dj", "rekordbox", "serato", "traktor", "music", "sync"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.0",
    "mutagen>=1.48.1",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.urls]
Homepage = "https://github.com/SakiiR/bandcamp-sync"
Repository = "https://github.com/SakiiR/bandcamp-sync"
Issues = "https://github.com/SakiiR/bandcamp-sync/issues"

[project.scripts]
bandcamp-sync = "bandcamp_sync.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bandcamp_sync"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# Standard rule set: pyflakes (F) + pycodestyle (E/W) + import sorting (I)
# + pyupgrade (UP) + flake8-bugbear (B).
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options/arguments as call expressions in parameter
# defaults (e.g. ``x: int = typer.Option(...)``); this is the intended API, so
# B008 (function call in default) does not apply to them.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# typing.py is auto-generated from bandcamp's JSON: huge type-alias names,
# long lines, mid-file imports and legacy Union syntax are expected there.
"bandcamp_sync/typing.py" = ["E501", "E402", "UP007"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
# Strict: any warning-level diagnostic fails the check too.
error-on-warning = true

[[tool.ty.overrides]]
# typing.py is auto-generated; its TypedDict variable/name mismatches (e.g.
# numeric seller-id keys) are expected and not worth rewriting by hand.
include = ["bandcamp_sync/typing.py"]
rules = { "mismatched-typeddict-name" = "ignore" }
